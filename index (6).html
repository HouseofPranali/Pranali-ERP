<style>
  :root{
    --paper:#FBF6F6;
    --panel:#FFFFFF;
    --ink:#2A1E20;
    --ink-soft:#7A6669;
    --line:#EAD9DB;
    --brass:#6E1524;
    --brass-soft:#F3E1E4;
    --thread:#A6293B;
    --thread-soft:#F6E3E6;
    --green:#3F6B4E;
    --green-soft:#E1EADD;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .num{font-family:'IBM Plex Mono',monospace;}
  button{font-family:'Work Sans',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Work Sans',sans-serif;}

  /* ---- App shell ---- */
  .app{max-width:960px;margin:0 auto;padding:0 16px 100px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;padding:22px 4px 14px;border-bottom:2px solid var(--ink);}
  .topbar .mark{display:flex;align-items:center;gap:12px;}
  .topbar .logo-wrap{width:48px;height:48px;background:#FFFFFF;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 3px rgba(42,30,32,0.08);}
  .topbar .logo-img{width:40px;height:40px;object-fit:contain;}
  .topbar h1{font-size:22px;letter-spacing:0.2px;}
  .topbar .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .gear{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:15px;color:var(--ink-soft);}

  nav.tabs{display:flex;gap:4px;margin:16px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto;}
  nav.tabs button{background:none;border:none;padding:10px 14px;font-size:14px;color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap;}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--brass);font-weight:600;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .section-title h2{font-size:18px;}

  /* buttons */
  .btn{border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:500;border:1px solid transparent;}
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-brass{background:var(--brass);color:#fff;}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:none;border:1px solid var(--thread);color:var(--thread);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}

  /* Dashboard cards */
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .card .label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
  .card .value{font-size:22px;margin-top:4px;font-weight:500;}
  .card.accent-brass{border-left:3px solid var(--brass);}
  .card.accent-thread{border-left:3px solid var(--thread);}
  .card.accent-green{border-left:3px solid var(--green);}

  .empty{padding:32px 12px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .empty .big{font-size:28px;display:block;margin-bottom:6px;}

  /* Lists */
  .list-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);gap:10px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .main{flex:1;min-width:0;}
  .list-row .title{font-weight:500;font-size:14.5px;}
  .list-row .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .list-row .amt{font-family:'IBM Plex Mono',monospace;font-size:14.5px;white-space:nowrap;}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
  .tag-paid{background:var(--green-soft);color:var(--green);}
  .tag-due{background:var(--thread-soft);color:var(--thread);}
  .tag-partial{background:var(--brass-soft);color:var(--brass);}

  /* Forms */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:var(--paper);color:var(--ink);}
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media(max-width:520px){.row2,.row3{grid-template-columns:1fr;}}

  .measure-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,190px));gap:10px 16px;margin-bottom:10px;}
  .measure-subgroup{margin-bottom:14px;}
  .measure-subtitle{font-family:'Fraunces',serif;font-size:13.5px;font-weight:600;color:var(--brass);margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:4px;}
  .measure-item label{font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .measure-item .unit-wrap{position:relative;}
  .measure-item input{padding-right:28px;font-family:'IBM Plex Mono',monospace;}
  .measure-item .unit{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-soft);}
  .custom-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .custom-row input{flex:1;}

  .line-items{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px;}
  .li-head,.li-row{display:grid;grid-template-columns:1fr 60px 90px 90px 30px;gap:8px;padding:8px 10px;align-items:center;}
  .li-head{background:var(--paper);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.4px;}
  .li-row{border-top:1px solid var(--line);}
  .li-row input{padding:6px 8px;font-size:13px;}
  .li-row .rm{background:none;border:none;color:var(--thread);font-size:16px;}
  @media(max-width:520px){.li-head{display:none;} .li-row{grid-template-columns:1fr;} }

  .totals-box{margin-top:8px;padding:12px 14px;background:var(--paper);border-radius:8px;font-size:14px;}
  .totals-box .t-row{display:flex;justify-content:space-between;padding:3px 0;}
  .totals-box .t-row.final{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:600;font-size:16px;}
  .totals-box .t-row.due{color:var(--thread);font-weight:600;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(42,36,29,0.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:50;}
  .modal{background:var(--panel);border-radius:var(--radius);padding:22px;max-width:560px;width:100%;margin:20px 0;}
  .modal h2{font-size:19px;margin-bottom:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .cust-detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .back-link{background:none;border:none;color:var(--ink-soft);font-size:13px;padding:0 0 12px;}

  /* Invoice print view */
  .invoice-sheet{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:36px;}
  .inv-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:20px;}
  .inv-top h1{font-size:24px;}
  .inv-biz{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:4px;}
  .inv-meta{text-align:right;font-size:13px;}
  .inv-meta .no{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;}
  .inv-parties{display:flex;justify-content:space-between;margin-bottom:20px;gap:20px;flex-wrap:wrap;}
  .inv-parties .block{font-size:13px;line-height:1.6;}
  .inv-parties .block .h{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:4px;}
  table.inv-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
  table.inv-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding:6px 8px;}
  table.inv-table td{padding:8px;border-bottom:1px solid var(--line);font-size:13.5px;}
  table.inv-table td.r,table.inv-table th.r{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .inv-footer-note{font-size:12px;color:var(--ink-soft);margin-top:20px;border-top:1px solid var(--line);padding-top:14px;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;padding:0;margin:0;}
    .invoice-sheet{border:none;border-radius:0;padding:0;}
  }

  .fab-add{position:fixed;bottom:22px;right:22px;background:var(--brass);color:#fff;border:none;border-radius:50%;width:54px;height:54px;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:20;}

  /* Sketches */
  .sketch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
  .sketch-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);cursor:pointer;}
  .sketch-card img{width:100%;height:120px;object-fit:contain;background:#fff;display:block;}
  .sketch-card .sc-info{padding:6px 8px;}
  .sketch-card .sc-title{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sketch-card .sc-date{font-size:11px;color:var(--ink-soft);}

  .canvas-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .canvas-toolbar .swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .canvas-toolbar .swatch.active{border-color:var(--ink);}
  .canvas-wrap{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;touch-action:none;}
  .canvas-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;}
  .sketch-view-img{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:100;opacity:0;transition:opacity 0.25s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>

<div id="printArea" style="display:none"></div>
<div class="app" id="app"></div>
<div id="toast" class="toast"></div>

/* ---------------------------------------------------------
   CLOUD SYNC (Supabase) — optional, works across devices.
   Configured once in Settings; the URL/key are kept in localStorage on
   each device (not inside the synced data), same as any app credential.
   Data lives in a simple key/value table: kv_store(key text primary key, value jsonb).

   Baked-in default so the app is connected to House of Pranali's Supabase
   project out of the box, on any device, with no manual Settings step.
   This is the "publishable" key, which Supabase confirms is safe to embed
   in client-side code like this — it has no access beyond what the
   database's table permissions allow.
--------------------------------------------------------- */
const DEFAULT_SUPABASE_URL = 'https://ykawqfysspvjhovdyixq.supabase.co';
const DEFAULT_SUPABASE_KEY = 'sb_publishable_HfgDbvv1Z5ZLfY89mt-uHg_KyThtMa5';

function isCloudDisabled(){
  try{ return localStorage.getItem(LS_PREFIX + 'supabase-disabled') === '1'; }
  catch(e){ return false; }
}
function getSupabaseUrl(){
  if(isCloudDisabled()) return '';
  try{
    const v = (localStorage.getItem(LS_PREFIX + 'supabase-url') || '').trim().replace(/\/+$/,'');
    return v || DEFAULT_SUPABASE_URL;
  }catch(e){ return DEFAULT_SUPABASE_URL; }
}
function getSupabaseKey(){
  if(isCloudDisabled()) return '';
  try{
    const v = (localStorage.getItem(LS_PREFIX + 'supabase-key') || '').trim();
    return v || DEFAULT_SUPABASE_KEY;
  }catch(e){ return DEFAULT_SUPABASE_KEY; }
}
function setSupabaseConfig(url, key){
  try{
    localStorage.setItem(LS_PREFIX + 'supabase-url', (url||'').trim().replace(/\/+$/,''));
    localStorage.setItem(LS_PREFIX + 'supabase-key', (key||'').trim());
    localStorage.removeItem(LS_PREFIX + 'supabase-disabled');
  }catch(e){}
}
function disableCloudSync(){
  try{
    localStorage.removeItem(LS_PREFIX + 'supabase-url');
    localStorage.removeItem(LS_PREFIX + 'supabase-key');
    localStorage.setItem(LS_PREFIX + 'supabase-disabled', '1');
  }catch(e){}
}
function hasCloudSync(){ return !!(getSupabaseUrl() && getSupabaseKey()); }

async function cloudGet(key){
  const base = getSupabaseUrl(), apiKey = getSupabaseKey();
  if(!base || !apiKey) return null;
  try{
    const res = await fetch(`${base}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`, {
      headers: { 'apikey': apiKey, 'Authorization': `Bearer ${apiKey}` }
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = await res.json();
    return (rows && rows.length) ? rows[0].value : null;
  }catch(e){ return undefined; } // undefined = couldn't reach cloud; null = reached but empty
}
async function cloudPut(key, data){
  const base = getSupabaseUrl(), apiKey = getSupabaseKey();
  if(!base || !apiKey) return false;
  try{
    const res = await fetch(`${base}/rest/v1/kv_store`, {
      method: 'POST',
      headers: {
        'apikey': apiKey,
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify([{ key, value: data }])
    });
    return res.ok;
  }catch(e){ return false; }
}

async function loadState(){
  let loadedFromSomewhere = false;

  // 1) Try the cross-device cloud database first, if configured — freshest copy.
  if(hasCloudSync()){
    const cloudData = await cloudGet('studio-data');
    if(cloudData && typeof cloudData === 'object'){
      state = cloudData;
      loadedFromSomewhere = true;
    }
  }

  // 2) Claude's built-in storage (only relevant when running inside Claude).
  if(!loadedFromSomewhere && HAS_CLOUD_STORAGE){
    try{
      const res = await window.storage.get('studio-data', false);
      if(res && res.value){ state = JSON.parse(res.value); loadedFromSomewhere = true; }
    }catch(e){ /* fall through to local storage below */ }
  }

  // 3) This browser's local storage — offline cache / final fallback.
  if(!loadedFromSomewhere && localStorageAvailable()){
    try{
      const raw = localStorage.getItem(LS_PREFIX + 'studio-data');
      if(raw){ state = JSON.parse(raw); loadedFromSomewhere = true; }
    }catch(e){ /* use default state */ }
  }
  usingLocalFallback = HAS_CLOUD_STORAGE && !hasCloudSync() && loadedFromSomewhere ? true : false;

  if(!state.orders) state.orders = [];
  if(!state.business) state.business = { name:"Label by Pranali", phone:"", address:"", upi:"", note:"Thank you for your order." };
  if(!state.business.users) state.business.users = [];
  // Migrate an old single app-password setup into the new user list, once.
  if(state.business.appPassword && state.business.users.length===0){
    state.business.users.push({ id: uid(), username: 'Owner', password: state.business.appPassword });
  }

  // Sketches/photos are stored per-customer in their own slot so a large photo
  // can never block saving the rest of the app's data.
  for(const c of state.customers){
    let got = false;
    if(hasCloudSync()){
      const cloudSketches = await cloudGet(`sketches:${c.id}`);
      if(Array.isArray(cloudSketches)){ c.sketches = cloudSketches; got = true; }
    }
    if(!got && HAS_CLOUD_STORAGE){
      try{
        const res = await window.storage.get(`sketches:${c.id}`, false);
        if(res && res.value){ c.sketches = JSON.parse(res.value); got = true; }
      }catch(e){ /* fall through */ }
    }
    if(!got){
      if(localStorageAvailable()){
        try{
          const raw = localStorage.getItem(LS_PREFIX + `sketches:${c.id}`);
          c.sketches = raw ? JSON.parse(raw) : (c.sketches || []);
        }catch(e){ c.sketches = c.sketches || []; }
      } else {
        c.sketches = c.sketches || [];
      }
    }
  }
  loaded = true;
  render();
}

async function saveState(){
  // Save a lightweight copy without sketch image data — that lives in its own slots.
  const lightCustomers = state.customers.map(c=>{
    const { sketches, ...rest } = c;
    return rest;
  });
  const snapshot = { ...state, customers: lightCustomers };
  let payload;
  try{
    payload = JSON.stringify(snapshot);
  }catch(e){
    showToast("Couldn't save — data couldn't be prepared. Please tell support this error: " + (e && e.message));
    return;
  }

  // Always cache locally first — instant, offline-safe.
  if(localStorageAvailable()){
    try{ localStorage.setItem(LS_PREFIX + 'studio-data', payload); }catch(e){ /* ignore, try cloud anyway */ }
  }

  // Push to the cross-device cloud database, if configured.
  if(hasCloudSync()){
    const ok = await cloudPut('studio-data', snapshot);
    if(!ok){ showToast("Saved on this device — couldn't reach your cloud database. Check your connection.", 4000); }
    return;
  }

  // No cloud sync configured — fall back to Claude's storage if we're running inside Claude.
  if(!HAS_CLOUD_STORAGE) return; // already saved to localStorage above; standalone with no cloud configured

  const sizeKb = Math.round(payload.length / 1024);
  for(let attempt=1; attempt<=2; attempt++){
    try{
      const result = await window.storage.set('studio-data', payload, false);
      if(!result){ throw new Error('empty result from storage.set'); }
      usingLocalFallback = false;
      return;
    }catch(e){
      if(attempt===2){
        usingLocalFallback = true;
        showToast("Saved on this device only — Claude's cloud save isn't responding right now.", 4000);
      }else{
        await new Promise(r=>setTimeout(r, 400));
      }
    }
  }
}
async function saveSketches(customerId){
  const c = state.customers.find(c=>c.id===customerId);
  if(!c) return;
  const payload = JSON.stringify(c.sketches||[]);

  if(localStorageAvailable()){
    try{ localStorage.setItem(LS_PREFIX + `sketches:${customerId}`, payload); }catch(e){ /* ignore */ }
  }

  if(hasCloudSync()){
    const ok = await cloudPut(`sketches:${customerId}`, c.sketches||[]);
    if(!ok){ showToast("Photo saved on this device — couldn't reach your cloud database.", 4000); }
    return;
  }

  if(!HAS_CLOUD_STORAGE) return; // already saved locally above

  try{
    const result = await window.storage.set(`sketches:${customerId}`, payload, false);
    if(!result){ throw new Error('empty result'); }
  }catch(e){
    showToast("Photo saved on this device only — Claude's cloud save isn't responding right now.", 4000);
  }
}
function compressImageDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,width,height);
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}
function showToast(msg, durationMs){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), durationMs || 1800);
}

--------------------------------------------------------- */
function invoiceTotal(inv){
  return inv.items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.rate)||0), 0);
}
function invoiceBalance(inv){
  return invoiceTotal(inv) - (Number(inv.advance)||0);
}
function invoiceStatus(inv){
  const bal = invoiceBalance(inv);
  if(bal<=0) return 'paid';
  if((Number(inv.advance)||0) > 0) return 'partial';
  return 'due';
}
function customerName(id){
  const c = state.customers.find(c=>c.id===id);
  return c ? c.name : "—";
}
function totals(){
  const totalInvoiced = state.invoices.reduce((s,i)=>s+invoiceTotal(i),0);
  const totalReceived = state.invoices.reduce((s,i)=>s + Math.min(Number(i.advance)||0, invoiceTotal(i)),0);
  const totalExpenses = state.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const outstanding = state.invoices.reduce((s,i)=>s+Math.max(invoiceBalance(i),0),0);
  const profit = totalReceived - totalExpenses;
  return {totalInvoiced,totalReceived,totalExpenses,outstanding,profit};
}

  if(!loaded){ app.innerHTML = `<div class="empty">Loading…</div>`; return; }
  if(loginRequired() && !isUnlocked()){
    app.innerHTML = loginPage();
    attachLoginPageHandlers();
    return;
  }
  app.innerHTML = `
    ${topbar()}
    ${tabs()}
    <div id="tabContent"></div>
  `;
  const content = document.getElementById('tabContent');
  if(view.tab==='dashboard') content.innerHTML = renderDashboard();
  else if(view.tab==='customers') content.innerHTML = view.customerId ? renderCustomerDetail() : renderCustomers();
  else if(view.tab==='invoices') content.innerHTML = view.invoiceId ? renderInvoiceView() : renderInvoices();
  else if(view.tab==='expenses') content.innerHTML = renderExpenses();

  attachGlobalHandlers();
}

function isUnlocked(){
  try{ return sessionStorage.getItem(LS_PREFIX + 'unlocked') === '1'; }
  catch(e){ return true; } // if sessionStorage is blocked, don't lock the person out
}
function currentUsername(){
  try{ return sessionStorage.getItem(LS_PREFIX + 'unlocked-user') || ''; }
  catch(e){ return ''; }
}
function setUnlocked(v, username){
  try{
    if(v){
      sessionStorage.setItem(LS_PREFIX + 'unlocked', '1');
      sessionStorage.setItem(LS_PREFIX + 'unlocked-user', username || '');
    } else {
      sessionStorage.removeItem(LS_PREFIX + 'unlocked');
      sessionStorage.removeItem(LS_PREFIX + 'unlocked-user');
    }
  }catch(e){}
}

  if(custTag) metaParts.push(custTag);
  if(orderTag) metaParts.push(orderTag);
  return `

        <div class="title">${escapeHtml(e.category)}${e.description? ' — '+escapeHtml(e.description):''}</div>

function openModal(html){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'modalBackdrop';
  wrap.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) closeModal(); });
}
function closeModal(){
  const m = document.getElementById('modalBackdrop');
  if(m) m.remove();
}

function customerFormModal(existing){
  const c = existing || {name:'',phone:'',address:'',notes:'',measurements:{},custom:[]};
  const isNew = !existing;
  const html = `
    <h2>${isNew? 'New customer':'Edit customer'}</h2>
    <div class="field"><label>Name *</label><input id="fName" value="${escapeAttr(c.name)}" placeholder="Customer name"></div>

      <div class="field"><label>Phone</label><input id="fPhone" value="${escapeAttr(c.phone||'')}" placeholder="10-digit number"></div>
      <div class="field"><label>Address</label><input id="fAddress" value="${escapeAttr(c.address||'')}" placeholder="Optional"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="fNotes" placeholder="Fitting preferences, allergies, etc.">${escapeHtml(c.notes||'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">${isNew? 'Add customer':'Save changes'}</button>
    </div>
  `;
  openModal(html);
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = ()=>{
    const name = document.getElementById('fName').value.trim();
    if(!name){ showToast("Name is required"); return; }
    const data = {
      name,
      phone: document.getElementById('fPhone').value.trim(),
      address: document.getElementById('fAddress').value.trim(),
      notes: document.getElementById('fNotes').value.trim(),
    };
    if(isNew){
      const nc = {id:uid(), measurements:{}, custom:[], sketches:[], updatedAt:null, ...data};
      state.customers.push(nc);
      closeModal(); saveState(); view.customerId = nc.id; render();
    } else {
      Object.assign(c, data);
      closeModal(); saveState(); render();
    }
  };
}

function invoiceFormModal(existing, presetCustomerId, presetOrderId){
  const isNew = !existing;
  let presetOrder = presetOrderId ? (state.orders||[]).find(o=>o.id===presetOrderId) : null;
  const inv = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: uid(),
    number: state.nextInvoiceNo,
    customerId: presetCustomerId || (state.customers[0] ? state.customers[0].id : ''),
    workOrderId: presetOrderId || null,
    date: today(),
    items: presetOrder ? presetOrder.items.map(it=>({desc: it.name, qty:1, rate:0})) : [{desc:'', qty:1, rate:0}],
    advance: presetOrder ? (presetOrder.advance || 0) : 0,
    notes: ''
  };

  function itemsHTML(){
    return inv.items.map((it,idx)=>`
      <div class="li-row">
        <input placeholder="Description" value="${escapeAttr(it.desc)}" data-it-desc="${idx}">
        <input type="number" placeholder="Qty" value="${it.qty}" data-it-qty="${idx}">
        <input type="number" placeholder="Rate" value="${it.rate}" data-it-rate="${idx}">
        <div class="num" id="itAmt-${idx}" style="text-align:right;font-size:13px">₹${money((Number(it.qty)||0)*(Number(it.rate)||0))}</div>
        <button class="rm" data-it-remove="${idx}">✕</button>
      </div>`).join('');
  }

  function orderSelectOptions(customerId){
    const ords = (state.orders||[]).filter(o=>o.customerId===customerId);
    if(ords.length===0) return `<option value="">No work orders for this customer</option>`;
    return `<option value="">None</option>` + ords.map(o=>`<option value="${o.id}" ${o.id===inv.workOrderId?'selected':''}>${escapeHtml(orderItemsSummary(o))} — ${fmtDate(o.date)}</option>`).join('');
  }

  const custOptions = state.customers.map(c=>`<option value="${c.id}" ${c.id===inv.customerId?'selected':''}>${escapeHtml(c.name)}</option>`).join('');

  const html = `
    <h2>${isNew? 'New invoice':'Edit invoice'}</h2>
    <div class="row2">
      <div class="field"><label>Customer *</label>
        <select id="fCustomer">${custOptions || '<option value="">No customers yet</option>'}</select>
      </div>
      <div class="field"><label>Date</label><input type="date" id="fDate" value="${inv.date}"></div>
    </div>
    <div class="field"><label>Fetch from work order (optional)</label>
      <select id="fWorkOrder">${orderSelectOptions(inv.customerId)}</select>
    </div>
    <div class="field"><label>Items</label>
      <div class="line-items">
        <div class="li-head"><div>Description</div><div>Qty</div><div>Rate</div><div>Amount</div><div></div></div>
        <div id="itemsWrap">${itemsHTML()}</div>
      </div>
      <button class="btn btn-ghost btn-sm" id="btnAddItem" style="margin-top:8px">+ Add line item</button>
    </div>
    <div class="row2">
      <div class="field"><label>Advance / amount received</label><input type="number" id="fAdvance" value="${inv.advance}"></div>
      <div class="field"><label>Notes</label><textarea id="fInvNotes" placeholder="Delivery date, terms…">${escapeHtml(inv.notes||'')}</textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">${isNew? 'Create invoice':'Save changes'}</button>
    </div>
  `;
  openModal(html);
  document.getElementById('mCancel').onclick = closeModal;

  document.getElementById('fCustomer').onchange = (e)=>{
    document.getElementById('fWorkOrder').innerHTML = orderSelectOptions(e.target.value);
  };
  document.getElementById('fWorkOrder').onchange = (e)=>{
    const oid = e.target.value;
    inv.workOrderId = oid || null;
    const ord = (state.orders||[]).find(o=>o.id===oid);
    if(ord){
      const isBlankFirst = inv.items.length===1 && !inv.items[0].desc && !Number(inv.items[0].rate);
      const newLines = (ord.items||[]).map(it=>({desc: it.name, qty:1, rate:0}));
      if(isBlankFirst){ inv.items = newLines.length? newLines : inv.items; }
      else { inv.items.push(...newLines); }
      refreshItems();
      const advField = document.getElementById('fAdvance');
      if(ord.advance && advField && (!Number(advField.value))){
        advField.value = ord.advance;
      }
    }
  };

  function bindItemHandlers(){
    document.querySelectorAll('[data-it-remove]').forEach(b=>{
      b.onclick = ()=>{
        if(inv.items.length<=1) return;
        inv.items.splice(Number(b.dataset.itRemove),1);
        refreshItems();
      };
    });
    document.querySelectorAll('[data-it-desc]').forEach(inp=> inp.oninput = ()=>{ inv.items[Number(inp.dataset.itDesc)].desc = inp.value; });
    document.querySelectorAll('[data-it-qty]').forEach(inp=> inp.oninput = ()=>{
      const idx = Number(inp.dataset.itQty);
      inv.items[idx].qty = inp.value;
      updateRowAmount(idx);
    });
    document.querySelectorAll('[data-it-rate]').forEach(inp=> inp.oninput = ()=>{
      const idx = Number(inp.dataset.itRate);
      inv.items[idx].rate = inp.value;
      updateRowAmount(idx);
    });
  }
  function updateRowAmount(idx){
    const it = inv.items[idx];
    const el = document.getElementById(`itAmt-${idx}`);
    if(el) el.textContent = '₹' + money((Number(it.qty)||0)*(Number(it.rate)||0));
  }
  function refreshItems(){
    document.getElementById('itemsWrap').innerHTML = itemsHTML();
    bindItemHandlers();
  }
  bindItemHandlers();

  document.getElementById('btnAddItem').onclick = ()=>{
    inv.items.push({desc:'',qty:1,rate:0});
    refreshItems();
  };

  document.getElementById('mSave').onclick = ()=>{
    const customerId = document.getElementById('fCustomer').value;
    if(!customerId){ showToast("Add a customer first"); return; }
    inv.customerId = customerId;
    inv.date = document.getElementById('fDate').value || today();
    inv.advance = Number(document.getElementById('fAdvance').value)||0;
    inv.notes = document.getElementById('fInvNotes').value.trim();
    inv.items = inv.items.filter(it=>it.desc || Number(it.rate)>0);
    if(inv.items.length===0) inv.items = [{desc:'Service', qty:1, rate:0}];

    if(isNew){
      state.invoices.push(inv);
      state.nextInvoiceNo += 1;
      closeModal(); saveState();
      view.tab='invoices'; view.invoiceId = inv.id; render();
    } else {
      const idx = state.invoices.findIndex(i=>i.id===inv.id);
      state.invoices[idx] = inv;
      closeModal(); saveState(); render();
    }
  };
}

async function exportBackup(){
  showToast("Preparing backup…");
  const full = JSON.parse(JSON.stringify(state));
  // Make sure every customer's sketches are included in the export, even though
  // they're stored separately day-to-day.
  for(const c of full.customers){
    const live = state.customers.find(x=>x.id===c.id);
    c.sketches = (live && live.sketches) || [];
  }
  const payload = JSON.stringify(full, null, 2);
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `label-by-pranali-backup-${today()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
  showToast("Backup downloaded");
}

function importBackup(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = ()=>{
    const file = input.files && input.files[0];
    document.body.removeChild(input);
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const imported = JSON.parse(reader.result);
        if(!imported || !Array.isArray(imported.customers)){
          showToast("That file doesn't look like a valid backup");
          return;
        }
        confirmRestoreModal(imported);
      }catch(e){
        showToast("Couldn't read that file — is it a backup .json?");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function sketchDrawModal(customer){
  const W = 320, H = 420;
  let color = getComputedStyleColor('--brass') || '#6E1524';
  let lineWidth = 3;
  let erasing = false;
  let undoStack = [];

  const html = `
    <h2>Sketch design — ${escapeHtml(customer.name)}</h2>
    <div class="canvas-toolbar">
      ${['#6E1524','#241A1B','#2E5C8A','#3F6B4E','#B8860B'].map(c=>`<span class="swatch ${c===color?'active':''}" style="background:${c}" data-color="${c}"></span>`).join('')}
      <button class="btn btn-ghost btn-sm" id="btnEraser">Eraser</button>
      <label style="font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px">Size
        <input type="range" id="brushSize" min="1" max="10" value="3" style="width:70px">
      </label>
      <button class="btn btn-ghost btn-sm" id="btnUndo">Undo</button>
      <button class="btn btn-ghost btn-sm" id="btnClear">Clear</button>
    </div>
    <div class="canvas-wrap" style="aspect-ratio:${W}/${H}">
      <canvas id="drawCanvas" width="${W}" height="${H}"></canvas>
    </div>
    <div class="field" style="margin-top:12px"><label>Title</label><input id="fSketchTitle" placeholder="e.g. Front bodice design"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">Save sketch</button>
    </div>
  `;
  openModal(html);

  const draw = document.getElementById('drawCanvas');
  const dctx = draw.getContext('2d');
  dctx.fillStyle = '#ffffff';
  dctx.fillRect(0,0,W,H);

  function posFromEvent(e){
    const rect = draw.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  let drawing = false;
  draw.addEventListener('pointerdown', (e)=>{
    drawing = true;
    undoStack.push(dctx.getImageData(0,0,W,H));
    if(undoStack.length>15) undoStack.shift();
    const p = posFromEvent(e);
    dctx.beginPath();
    dctx.moveTo(p.x,p.y);
    draw.setPointerCapture(e.pointerId);
  });
  draw.addEventListener('pointermove', (e)=>{
    if(!drawing) return;
    const p = posFromEvent(e);
    dctx.lineCap = 'round';
    dctx.lineJoin = 'round';
    dctx.lineWidth = lineWidth;
    if(erasing){
      dctx.globalCompositeOperation = 'source-over';
      dctx.strokeStyle = '#ffffff';
    } else {
      dctx.globalCompositeOperation = 'source-over';
      dctx.strokeStyle = color;
    }
    dctx.lineTo(p.x,p.y);
    dctx.stroke();
  });
  function endStroke(e){ drawing = false; }
  draw.addEventListener('pointerup', endStroke);
  draw.addEventListener('pointerleave', endStroke);

  document.querySelectorAll('.swatch').forEach(sw=>{
    sw.onclick = ()=>{
      color = sw.dataset.color; erasing = false;
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
      document.getElementById('btnEraser').classList.remove('btn-primary');
    };
  });
  document.getElementById('btnEraser').onclick = (e)=>{
    erasing = !erasing;
    e.target.classList.toggle('btn-primary', erasing);
  };
  document.getElementById('brushSize').oninput = (e)=>{ lineWidth = Number(e.target.value); };
  document.getElementById('btnUndo').onclick = ()=>{
    if(undoStack.length===0) return;
    dctx.putImageData(undoStack.pop(), 0, 0);
  };
  document.getElementById('btnClear').onclick = ()=>{
    undoStack.push(dctx.getImageData(0,0,W,H));
    dctx.fillStyle = '#ffffff';
    dctx.fillRect(0,0,W,H);
  };
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = ()=>{
    const dataUrl = draw.toDataURL('image/png');
    if(!customer.sketches) customer.sketches = [];
    customer.sketches.push({
      id: uid(),
      title: document.getElementById('fSketchTitle').value.trim(),
      dataUrl,
      createdAt: today()
    });
    closeModal(); saveSketches(customer.id); render();
    showToast("Sketch saved");
  };
}

function chunk(arr, size){
  const out = [];
  for(let i=0;i<arr.length;i+=size){ out.push(arr.slice(i,i+size)); }
  return out;
}

  });
  const btnBackCustomers = document.getElementById('btnBackCustomers');
  if(btnBackCustomers) btnBackCustomers.onclick = ()=>{ view.customerId=null; render(); };

  const btnEditCustomer = document.getElementById('btnEditCustomer');
  if(btnEditCustomer) btnEditCustomer.onclick = ()=>{
    const c = state.customers.find(c=>c.id===view.customerId);
    customerFormModal(c);
  };
  const btnDeleteCustomer = document.getElementById('btnDeleteCustomer');
  if(btnDeleteCustomer) btnDeleteCustomer.onclick = ()=>{
    const delId = view.customerId;
    confirmModal("This removes the customer record. Invoices already created will stay.", ()=>{
      state.customers = state.customers.filter(c=>c.id!==delId);
      view.customerId = null; saveState(); render();
      window.storage.delete(`sketches:${delId}`, false).catch(()=>{});
    });
  };
  const btnEditMeasurements = document.getElementById('btnEditMeasurements');
  if(btnEditMeasurements) btnEditMeasurements.onclick = ()=>{
    const c = state.customers.find(c=>c.id===view.customerId);
    measurementFormModal(c);
  };

  // Work orders
  document.querySelectorAll('[data-new-order-for]').forEach(el=>{
    el.onclick = ()=> orderFormModal(el.dataset.newOrderFor);
  });
  document.querySelectorAll('[data-edit-order]').forEach(el=>{
    el.onclick = ()=>{
      const o = (state.orders||[]).find(o=>o.id===el.dataset.editOrder);
      if(o) orderFormModal(o.customerId, o);
    };
  });
  document.querySelectorAll('[data-share-order]').forEach(el=>{
    el.onclick = ()=>{
      const o = (state.orders||[]).find(o=>o.id===el.dataset.shareOrder);
      if(o) openWorkOrderPage(o);
    };
  });
  document.querySelectorAll('[data-invoice-from-order]').forEach(el=>{
    el.onclick = ()=> invoiceFormModal(null, el.dataset.invoiceFromOrderCustomer, el.dataset.invoiceFromOrder);
  });
  document.querySelectorAll('[data-del-order]').forEach(el=>{
    el.onclick = ()=>{
      confirmModal("Remove this work order? Linked expenses will stay but lose this link.", ()=>{
        state.orders = state.orders.filter(o=>o.id!==el.dataset.delOrder);
        saveState(); render();
      });
    };
  });

  // Sketches
  document.querySelectorAll('[data-new-sketch-for]').forEach(el=>{
    el.onclick = ()=>{
      const c = state.customers.find(c=>c.id===el.dataset.newSketchFor);
      if(c) sketchDrawModal(c);
    };
  });
  document.querySelectorAll('[data-upload-photo-for]').forEach(el=>{
    el.onclick = ()=>{
      const c = state.customers.find(c=>c.id===el.dataset.uploadPhotoFor);
      if(c) uploadPhotoFor(c);
    };
  });
  document.querySelectorAll('[data-view-sketch]').forEach(el=>{
    el.onclick = ()=>{
      const c = state.customers.find(c=>c.id===view.customerId);
      if(!c) return;
      const s = (c.sketches||[]).find(s=>s.id===el.dataset.viewSketch);
      if(s) sketchViewModal(c, s);
    };
  });

  // Invoices
  const btnNewInvoice = document.getElementById('btnNewInvoice');
  if(btnNewInvoice) btnNewInvoice.onclick = ()=>{
    if(state.customers.length===0){ showToast("Add a customer first"); return; }
    invoiceFormModal(null);
  };
  document.querySelectorAll('[data-new-invoice-for]').forEach(el=>{
    el.onclick = ()=> invoiceFormModal(null, el.dataset.newInvoiceFor);
  });
  document.querySelectorAll('[data-open-invoice]').forEach(el=>{
    el.onclick = ()=>{ view.tab='invoices'; view.invoiceId = el.dataset.openInvoice; render(); };
  });
  const btnBackInvoices = document.getElementById('btnBackInvoices');
  if(btnBackInvoices) btnBackInvoices.onclick = ()=>{ view.invoiceId=null; render(); };

  const btnOpenInvoicePage = document.getElementById('btnOpenInvoicePage');
  if(btnOpenInvoicePage) btnOpenInvoicePage.onclick = ()=>{
    const inv = state.invoices.find(i=>i.id===view.invoiceId);
    openInvoicePage(inv);
  };
  const btnWhatsAppInvoice = document.getElementById('btnWhatsAppInvoice');
  if(btnWhatsAppInvoice) btnWhatsAppInvoice.onclick = ()=>{
    const inv = state.invoices.find(i=>i.id===view.invoiceId);
    whatsappInvoice(inv);
  };
  const btnEmailInvoice = document.getElementById('btnEmailInvoice');
  if(btnEmailInvoice) btnEmailInvoice.onclick = ()=>{
    const inv = state.invoices.find(i=>i.id===view.invoiceId);
    emailInvoice(inv);
  };
  const btnEditInvoice = document.getElementById('btnEditInvoice');
  if(btnEditInvoice) btnEditInvoice.onclick = ()=>{
    const inv = state.invoices.find(i=>i.id===view.invoiceId);
    invoiceFormModal(inv);
  };
  const btnRecordPayment = document.getElementById('btnRecordPayment');
  if(btnRecordPayment) btnRecordPayment.onclick = ()=>{
    const inv = state.invoices.find(i=>i.id===view.invoiceId);
    paymentModal(inv);
  };
  const btnDeleteInvoice = document.getElementById('btnDeleteInvoice');
  if(btnDeleteInvoice) btnDeleteInvoice.onclick = ()=>{
    confirmModal("This permanently deletes the invoice.", ()=>{
      state.invoices = state.invoices.filter(i=>i.id!==view.invoiceId);
      view.invoiceId=null; saveState(); render();
    });
  };

  // Expenses
  const btnNewExpense = document.getElementById('btnNewExpense');
  if(btnNewExpense) btnNewExpense.onclick = ()=>expenseFormModal(null);
  document.querySelectorAll('[data-new-expense-for]').forEach(el=>{
    el.onclick = ()=> expenseFormModal(el.dataset.newExpenseFor);
  });
  document.querySelectorAll('[data-del-expense]').forEach(el=>{
    el.onclick = ()=>{
      confirmModal("Remove this expense entry?", ()=>{
        state.expenses = state.expenses.filter(e=>e.id!==el.dataset.delExpense);
        saveState(); render();
      });
    };
  });
}

/* ---------------------------------------------------------
   UTIL
--------------------------------------------------------- */
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

loadState();
</script>
</body>
</html>
